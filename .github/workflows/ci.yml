name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [auth-service, user-service, booking-service, api-gateway]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          if [ -f "pom.xml" ]; then
            mvn clean package -DskipTests
          else
            echo "Service not yet implemented — skipping build"
          fi

      - name: Test ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          if [ -f "pom.xml" ]; then
            mvn test
          else
            echo "Service not yet implemented — skipping tests"
          fi
